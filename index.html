<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hearing Health Classification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Enforce Verdana typography across all elements */
    *, *::before, *::after {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Zero outer margins, zero padding, pure white edge-to-edge canvas for Moodle iframes */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #FFFFFF;
      color: #19587f;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      overflow-x: hidden;
    }

    /* Full-width container with NO outer border, margin, border-radius, or box-shadow */
    .stage-root {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: #FFFFFF;
    }

    /* Word Bank container styling */
    .word-bank-box {
      background-color: #FAFCFE;
      border: 1.5px dashed #B9CEDB;
      border-radius: 8px;
      transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .word-bank-box.is-drag-over {
      background-color: #F0F7FC;
      border-color: #19587f;
      border-style: solid;
      box-shadow: inset 0 0 0 2px rgba(25, 88, 127, 0.2);
    }

    /* Two-column classification table structural borders */
    .classification-table {
      border-top: 1.5px solid #E2DDD5;
      border-bottom: 1.5px solid #E2DDD5;
      background-color: #FFFFFF;
    }

    .table-col-divider {
      border-bottom: 1.5px solid #E2DDD5;
    }

    @media (min-width: 768px) {
      .table-col-divider {
        border-bottom: none;
        border-right: 1.5px solid #E2DDD5;
      }
    }

    .table-col-header {
      background-color: #FFF4EB;
      color: #ff791f;
      font-weight: 700;
      border-bottom: 1.5px solid #E2DDD5;
    }

    /* Drop zone interactive feedback */
    .drop-zone {
      background-color: #FFFFFF;
      transition: background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .drop-zone.is-drag-over {
      background-color: #FFF9F4;
      box-shadow: inset 0 0 0 2px rgba(255, 121, 31, 0.5);
    }

    .drop-zone.is-tap-target {
      background-color: #FFFBF7;
    }

    /* Draggable Word Pill Styling (exact Verdana Flash tactile card specifications) */
    .word-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      line-height: 1.25;
      color: #19587f;
      background: #FFFFFF;
      border: 2px solid #19587f;
      box-shadow: 0 2px 0 #19587f;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition:
        transform 0.15s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.15s ease,
        border-color 0.15s ease,
        background-color 0.15s ease,
        color 0.15s ease;
    }

    .word-pill:hover {
      background-color: #F5FAFD;
      transform: translateY(-1px);
      box-shadow: 0 3px 0 #19587f;
    }

    .word-pill:active {
      cursor: grabbing;
    }

    /* Tap-to-select active highlight ring in #ff791f */
    .word-pill.is-selected {
      border-color: #ff791f;
      background-color: #FFF6EE;
      box-shadow: 0 2px 0 #ff791f, 0 0 0 3px rgba(255, 121, 31, 0.28);
      transform: translateY(-1px);
    }

    /* Source placeholder while pointer-dragging */
    .word-pill.is-dragging-source {
      opacity: 0.24;
      border-style: dashed;
      box-shadow: none;
    }

    /* Floating drag clone following pointer */
    .drag-ghost {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      line-height: 1.25;
      color: #19587f;
      background: #FFFFFF;
      border: 2px solid #ff791f;
      border-radius: 6px;
      padding: 8px 14px;
      box-shadow: 0 8px 18px rgba(25, 88, 127, 0.24), 0 2px 0 #ff791f;
      will-change: transform;
    }

    /* Spring snap-in animation when placed */
    @keyframes springSnap {
      0%   { transform: scale(0.88); }
      55%  { transform: scale(1.04); }
      80%  { transform: scale(0.985); }
      100% { transform: scale(1); }
    }

    .snap-in {
      animation: springSnap 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Horizontal shake animation for incorrect placement */
    @keyframes pillShake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-5px); }
      40%      { transform: translateX(5px); }
      60%      { transform: translateX(-3px); }
      80%      { transform: translateX(3px); }
    }

    .shake-error {
      animation: pillShake 0.36s ease-in-out;
    }

    /* Checked validation states */
    .word-pill.is-correct {
      border-color: #238653;
      background-color: #EBF8F1;
      color: #1B6B42;
      box-shadow: 0 2px 0 #238653;
    }

    .word-pill.is-incorrect {
      border-color: #C93B2B;
      background-color: #FDF0EE;
      color: #A82A1C;
      box-shadow: 0 2px 0 #C93B2B;
    }

    /* Validation badge inside pill */
    .pill-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
    }

    .pill-badge.badge-correct {
      background-color: #238653;
      color: #FFFFFF;
    }

    .pill-badge.badge-incorrect {
      background-color: #C93B2B;
      color: #FFFFFF;
    }

    /* Tactile Flash-style Action Buttons */
    .flash-btn {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      font-weight: 700;
      font-size: 13px;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-check {
      background-color: #19587f;
      border: 2px solid #19587f;
      color: #FFFFFF;
      box-shadow: 0 2px 0 #0f3852;
    }

    .btn-check:hover {
      background-color: #1f6996;
      transform: translateY(-1px);
      box-shadow: 0 3px 0 #0f3852;
    }

    .btn-check:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #0f3852;
    }

    .btn-secondary {
      background-color: #FFFFFF;
      border: 2px solid #19587f;
      color: #19587f;
      box-shadow: 0 2px 0 #19587f;
    }

    .btn-secondary:hover {
      background-color: #F2F8FC;
      transform: translateY(-1px);
      box-shadow: 0 3px 0 #19587f;
    }

    .btn-secondary:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #19587f;
    }

    /* Subtle Continuous Anatomical Vector Animations */
    @keyframes soundWaveFlow1 {
      0%   { opacity: 0; transform: translateX(-14px) scale(0.94); }
      25%  { opacity: 0.62; }
      75%  { opacity: 0.36; }
      100% { opacity: 0; transform: translateX(22px) scale(1.04); }
    }

    @keyframes soundWaveFlow2 {
      0%   { opacity: 0; transform: translateX(-12px) scale(0.92); }
      30%  { opacity: 0.54; }
      80%  { opacity: 0.28; }
      100% { opacity: 0; transform: translateX(20px) scale(1.03); }
    }

    @keyframes eardrumMicroVibrate {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      25%      { transform: translate(0.75px, -0.25px) rotate(0.45deg); }
      50%      { transform: translate(-0.4px, 0.2px) rotate(-0.25deg); }
      75%      { transform: translate(0.65px, -0.15px) rotate(0.35deg); }
    }

    @keyframes ossiclesMicroVibrate {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      30%      { transform: translate(0.85px, -0.35px) rotate(-0.6deg); }
      60%      { transform: translate(-0.35px, 0.25px) rotate(0.35deg); }
      85%      { transform: translate(0.55px, -0.2px) rotate(-0.4deg); }
    }

    @keyframes cochleaShimmerPulse {
      0%, 100% { opacity: 0.28; transform: scale(0.99); }
      50%      { opacity: 0.72; transform: scale(1.02); }
    }

    @keyframes cochleaHarmonicHalo {
      0%, 100% { opacity: 0.72; transform: scale(0.97); }
      50%      { opacity: 1; transform: scale(1.06); }
    }

    @keyframes sparklePop {
      0%   { opacity: 0; transform: scale(0.2) rotate(0deg); }
      35%  { opacity: 1; transform: scale(1.18) rotate(35deg); }
      70%  { opacity: 0.88; transform: scale(0.96) rotate(65deg); }
      100% { opacity: 0; transform: scale(0.25) rotate(90deg); }
    }

    .anim-wave-1 {
      transform-origin: 185px 168px;
      animation: soundWaveFlow1 2.8s ease-in-out infinite;
    }

    .anim-wave-2 {
      transform-origin: 245px 166px;
      animation: soundWaveFlow2 2.8s ease-in-out 0.9s infinite;
    }

    .anim-wave-3 {
      transform-origin: 305px 164px;
      animation: soundWaveFlow2 2.8s ease-in-out 1.8s infinite;
    }

    .anim-eardrum {
      transform-origin: 368px 166px;
      animation: eardrumMicroVibrate 1.4s ease-in-out infinite;
    }

    .anim-ossicles {
      transform-origin: 392px 136px;
      animation: ossiclesMicroVibrate 1.4s ease-in-out 0.08s infinite;
    }

    .anim-cochlea-shimmer {
      transform-origin: 582px 162px;
      animation: cochleaShimmerPulse 3.2s ease-in-out infinite;
    }

    .cochlea-victory-active .victory-halo {
      opacity: 1;
      animation: cochleaHarmonicHalo 2s ease-in-out infinite;
    }

    .cochlea-victory-active .cochlea-core {
      filter: drop-shadow(0 0 10px rgba(248, 206, 120, 0.95)) drop-shadow(0 0 18px rgba(255, 121, 31, 0.6));
    }

    .sparkle-burst .sparkle-star {
      animation: sparklePop 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body>

  <!-- Edge-to-Edge Pure White Container (No outer margins, borders, radius, or shadows) -->
  <main class="stage-root w-full flex flex-col">

    <!-- TOP SECTION: Anatomical Ear Vector Illustration (centered, full width) -->
    <section class="w-full bg-[#FFFFFF] px-3 sm:px-5 pt-2 pb-2 flex items-center justify-center">

      <!-- Smooth-Shaded Anatomical Cross-Section of the Human Ear (No Labels) -->
      <div class="w-full flex items-center justify-center select-none">
        <svg
          id="earAnatomySvg"
          viewBox="102 36 708 246"
          class="w-full h-auto max-h-[230px] sm:max-h-[250px] block mx-auto overflow-visible"
          role="img"
          aria-label="Anatomical cross-section of the human ear"
        >
          <defs>
            <!-- Soft Feathered Cutout Mask blending seamlessly into #FFFFFF -->
            <filter id="featherMaskBlur" x="-15%" y="-15%" width="130%" height="130%">
              <feGaussianBlur stdDeviation="7" />
            </filter>

            <radialGradient id="cutoutFeatherGrad" cx="50%" cy="51%" r="49%" fx="50%" fy="51%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
              <stop offset="78%" stop-color="#FFFFFF" stop-opacity="1" />
              <stop offset="93%" stop-color="#FFFFFF" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </radialGradient>

            <mask id="anatomicalFeatherMask">
              <ellipse cx="458" cy="158" rx="350" ry="122" fill="url(#cutoutFeatherGrad)" filter="url(#featherMaskBlur)" />
            </mask>

            <filter id="harmonicAuraBlur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="11" />
            </filter>

            <!-- Warm Peach/Terracotta Auricle Gradients (#F7D5C2 to #C97B5B) -->
            <linearGradient id="auricleMainGrad" x1="15%" y1="10%" x2="88%" y2="88%">
              <stop offset="0%" stop-color="#FBE3D4" />
              <stop offset="32%" stop-color="#F7D5C2" />
              <stop offset="68%" stop-color="#E19C7E" />
              <stop offset="100%" stop-color="#C97B5B" />
            </linearGradient>

            <linearGradient id="auricleHelixHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF0E6" />
              <stop offset="45%" stop-color="#F7D5C2" />
              <stop offset="100%" stop-color="#D98F70" />
            </linearGradient>

            <radialGradient id="conchaBowlGrad" cx="58%" cy="52%" r="55%">
              <stop offset="0%" stop-color="#9E4F3D" />
              <stop offset="55%" stop-color="#C97B5B" />
              <stop offset="100%" stop-color="#E5A589" />
            </radialGradient>

            <linearGradient id="earlobeGrad" x1="25%" y1="0%" x2="75%" y2="100%">
              <stop offset="0%" stop-color="#F2C2AA" />
              <stop offset="55%" stop-color="#F7D5C2" />
              <stop offset="85%" stop-color="#DF9A7C" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </linearGradient>

            <!-- Surrounding Soft Tissue Fade into White -->
            <linearGradient id="surroundingSkinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
              <stop offset="18%" stop-color="#F8DFD0" stop-opacity="0.85" />
              <stop offset="50%" stop-color="#F2C8B2" stop-opacity="0.95" />
              <stop offset="82%" stop-color="#F8DFD0" stop-opacity="0.85" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </linearGradient>

            <!-- External Auditory Canal Gradients (#C97859 to #7A3B2E) -->
            <linearGradient id="earCanalLengthGrad" x1="0%" y1="45%" x2="100%" y2="55%">
              <stop offset="0%" stop-color="#C97859" />
              <stop offset="45%" stop-color="#A85742" />
              <stop offset="82%" stop-color="#874233" />
              <stop offset="100%" stop-color="#7A3B2E" />
            </linearGradient>

            <linearGradient id="earCanalWallShade" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#5E291F" stop-opacity="0.55" />
              <stop offset="32%" stop-color="#D98B6C" stop-opacity="0.18" />
              <stop offset="68%" stop-color="#C97859" stop-opacity="0.08" />
              <stop offset="100%" stop-color="#58251B" stop-opacity="0.62" />
            </linearGradient>

            <!-- Pale Yellow Temporal Bone Matrix (#EFE47A) -->
            <linearGradient id="temporalBoneGrad" x1="15%" y1="10%" x2="85%" y2="90%">
              <stop offset="0%" stop-color="#F8F2AE" />
              <stop offset="42%" stop-color="#EFE47A" />
              <stop offset="78%" stop-color="#E4D464" />
              <stop offset="100%" stop-color="#D7C452" />
            </linearGradient>

            <!-- Organic Burgundy-Magenta Marrow Pockets (#A7345B) -->
            <radialGradient id="marrowPocketGrad" cx="42%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#C64B74" />
              <stop offset="62%" stop-color="#A7345B" />
              <stop offset="100%" stop-color="#7D2040" />
            </radialGradient>

            <!-- Dark Middle-Ear Tympanic Cavity (#4A3531) -->
            <radialGradient id="middleEarCavityGrad" cx="48%" cy="48%" r="56%">
              <stop offset="0%" stop-color="#634843" />
              <stop offset="58%" stop-color="#4A3531" />
              <stop offset="100%" stop-color="#2E1F1C" />
            </radialGradient>

            <!-- Deep Indigo Inferior Contour (#3B498B) -->
            <linearGradient id="indigoContourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4B5CA6" />
              <stop offset="50%" stop-color="#3B498B" />
              <stop offset="100%" stop-color="#273266" />
            </linearGradient>

            <!-- Coral-Red Eustachian Tube Structure (#D95B59) -->
            <linearGradient id="coralEustachianGrad" x1="15%" y1="0%" x2="85%" y2="100%">
              <stop offset="0%" stop-color="#EC817F" />
              <stop offset="48%" stop-color="#D95B59" />
              <stop offset="86%" stop-color="#B33E3C" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </linearGradient>

            <!-- Pearly Silver-Blue Eardrum & Ossicles (#DCE5F0 / #8A9EB5) -->
            <radialGradient id="eardrumPearlGrad" cx="42%" cy="44%" r="58%">
              <stop offset="0%" stop-color="#F7FAFE" />
              <stop offset="48%" stop-color="#DCE5F0" />
              <stop offset="82%" stop-color="#A3B5CA" />
              <stop offset="100%" stop-color="#8A9EB5" />
            </radialGradient>

            <linearGradient id="ossicleSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="45%" stop-color="#DCE5F0" />
              <stop offset="100%" stop-color="#8A9EB5" />
            </linearGradient>

            <!-- Golden-Amber Semicircular Canals & Spiral Cochlea (#F8CE78 / #E5A243 / #B87324) -->
            <linearGradient id="amberCanalGrad" x1="15%" y1="5%" x2="85%" y2="95%">
              <stop offset="0%" stop-color="#FBE1A0" />
              <stop offset="35%" stop-color="#F8CE78" />
              <stop offset="72%" stop-color="#E5A243" />
              <stop offset="100%" stop-color="#B87324" />
            </linearGradient>

            <radialGradient id="cochleaSpiralGrad" cx="38%" cy="34%" r="64%">
              <stop offset="0%" stop-color="#FDE8B0" />
              <stop offset="34%" stop-color="#F8CE78" />
              <stop offset="70%" stop-color="#E5A243" />
              <stop offset="100%" stop-color="#B87324" />
            </radialGradient>

            <linearGradient id="vestibularNerveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#E5A243" />
              <stop offset="45%" stop-color="#F8CE78" />
              <stop offset="82%" stop-color="#FBE5B2" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </linearGradient>

            <!-- Golden Harmonic Glow & Victory Radial -->
            <radialGradient id="cochleaSubtleRadial" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFE8A3" stop-opacity="0.7" />
              <stop offset="55%" stop-color="#F8CE78" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#F8CE78" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="cochleaVictoryRadial" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFE699" stop-opacity="0.98" />
              <stop offset="45%" stop-color="#F8CE78" stop-opacity="0.68" />
              <stop offset="75%" stop-color="#ff791f" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#ff791f" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Feathered Anatomical Cutaway Illustration -->
          <g mask="url(#anatomicalFeatherMask)">
            <!-- Soft Subcutaneous Tissue Cushion -->
            <path d="M185,48 C235,44 295,46 355,52 L355,264 C295,268 235,266 185,256 Z" fill="url(#surroundingSkinGrad)" />

            <!-- Pale Yellow Temporal Bone Cutaway Block (#EFE47A) -->
            <path
              d="M275,52
                 C345,42 465,40 585,48
                 C675,54 745,74 778,108
                 C802,135 802,186 774,218
                 C735,258 645,272 535,274
                 C435,275 335,268 272,254
                 C256,222 258,195 276,184
                 L364,182 L364,146 L276,146
                 C258,132 258,82 275,52 Z"
              fill="url(#temporalBoneGrad)"
            />

            <!-- Subtle Warm Bone Contour Shading -->
            <path
              d="M342,68 C435,58 555,60 652,78 C712,90 738,125 734,168 C730,210 688,242 612,252 C515,264 405,258 338,240"
              fill="none"
              stroke="#D5C250"
              stroke-width="14"
              stroke-opacity="0.28"
              stroke-linecap="round"
            />

            <!-- Organic Burgundy-Magenta Marrow Pockets (#A7345B) -->
            <g fill="url(#marrowPocketGrad)" opacity="0.92">
              <path d="M312,68 C322,61 339,63 343,72 C346,80 335,88 322,86 C311,84 305,75 312,68 Z" />
              <path d="M358,62 C372,56 392,59 396,69 C399,78 386,86 371,84 C357,82 349,68 358,62 Z" />
              <path d="M412,60 C425,55 442,60 444,69 C446,78 432,83 419,80 C409,77 404,65 412,60 Z" />
              <path d="M460,64 C472,58 488,62 490,71 C492,79 478,84 466,81 C456,78 452,69 460,64 Z" />
              <path d="M506,66 C521,60 541,64 544,74 C547,83 533,90 518,87 C504,84 497,72 506,66 Z" />
              <path d="M562,68 C576,63 594,68 596,77 C598,86 583,91 570,88 C558,85 553,73 562,68 Z" />
              <path d="M614,74 C629,69 648,75 649,85 C650,94 634,99 621,95 C609,91 604,79 614,74 Z" />
              <path d="M666,86 C681,82 698,89 698,99 C698,108 682,112 669,107 C658,103 656,90 666,86 Z" />
              <path d="M294,102 C305,96 322,99 325,109 C328,118 315,125 303,122 C292,119 286,108 294,102 Z" />
              <path d="M338,98 C351,93 367,97 369,106 C371,115 357,121 345,118 C334,115 329,103 338,98 Z" />
              <path d="M712,108 C725,105 740,113 738,123 C736,132 721,135 710,129 C701,124 702,111 712,108 Z" />
              <path d="M688,184 C701,180 717,187 716,197 C715,207 699,211 687,206 C677,201 678,188 688,184 Z" />
              <path d="M636,214 C651,209 669,214 670,224 C671,234 654,240 640,236 C627,232 624,219 636,214 Z" />
              <path d="M582,226 C597,221 615,226 616,236 C617,246 600,252 586,248 C573,244 570,231 582,226 Z" />

  <script>
    (function () {
      "use strict";

      /**
       * Exact 8 Word Items and Target Categories
       * - causes (6): Headphones, Concerts, Ear damage, Volume, Noise, Ringing
       * - protect (2): Earplugs, Hearing protection
       */
      const WORD_ITEMS = [
        { id: "w1", text: "Headphones",         correctCategory: "causes"  },
        { id: "w2", text: "Concerts",           correctCategory: "causes"  },
        { id: "w3", text: "Ear damage",         correctCategory: "causes"  },
        { id: "w4", text: "Volume",             correctCategory: "causes"  },
        { id: "w5", text: "Noise",              correctCategory: "causes"  },
        { id: "w6", text: "Ringing",            correctCategory: "causes"  },
        { id: "w7", text: "Earplugs",           correctCategory: "protect" },
        { id: "w8", text: "Hearing protection", correctCategory: "protect" }
      ];

      // DOM References
      const wordBankEl     = document.getElementById("wordBank");
      const dropCausesEl   = document.getElementById("dropCauses");
      const dropProtectEl  = document.getElementById("dropProtect");
      const scoreDisplayEl = document.getElementById("scoreDisplay");
      const statusMsgEl    = document.getElementById("statusMessage");
      const checkBtn       = document.getElementById("checkBtn");
      const showAnswersBtn = document.getElementById("showAnswersBtn");
      const resetBtn       = document.getElementById("resetBtn");
      const innerEarGroup  = document.getElementById("innerEarGroup");
      const cochleaSparkles = document.getElementById("cochleaSparkles");

      const dropContainers = [wordBankEl, dropCausesEl, dropProtectEl];

      // Interaction State
      let selectedPillEl = null;
      let dragState = null;

      /**
       * Web Audio API Retro Flash Sound Synthesizer
       * Gracefully handles autoplay/iframe audio restrictions
       */
      const SoundFX = (function () {
        let ctx = null;

        function getCtx() {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              ctx = new AudioCtx();
            }
          }
          if (ctx && ctx.state === "suspended") {
            ctx.resume().catch(function () {});
          }
          return ctx;
        }

        function playTone(freq, endFreq, duration, type, volume, delay) {
          try {
            const audio = getCtx();
            if (!audio) return;
            const now = audio.currentTime + (delay || 0);
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freq, now);
            if (endFreq && endFreq !== freq) {
              osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
            }
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(volume || 0.08, now + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
          } catch (err) {
            // Ignore audio errors in restricted environments
          }
        }

        return {
          pickup: function () {
            playTone(460, 640, 0.075, "triangle", 0.07, 0);
          },
          drop: function () {
            playTone(340, 520, 0.09, "sine", 0.08, 0);
          },
          correct: function () {
            playTone(587.33, 587.33, 0.11, "triangle", 0.08, 0);
            playTone(880, 880, 0.18, "triangle", 0.08, 0.08);
          },
          wrong: function () {
            playTone(210, 155, 0.19, "sawtooth", 0.055, 0);
          },
          reset: function () {
            playTone(520, 280, 0.14, "sine", 0.065, 0);
          },
          victory: function () {
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach(function (n, idx) {
              playTone(n, n, 0.22, "triangle", 0.085, idx * 0.085);
            });
          }
        };
      })();

      /**
       * Fisher-Yates shuffle helper
       */
      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      /**
       * Clear validation state (classes & badge) on a single pill
       */
      function clearPillValidation(pill) {
        pill.classList.remove("is-correct", "is-incorrect", "shake-error");
        const oldBadge = pill.querySelector(".pill-badge");
        if (oldBadge) {
          oldBadge.remove();
        }
      }

      /**
       * Apply validation mark (✓ or ✕) to a pill
       */
      function markPill(pill, isCorrect) {
        clearPillValidation(pill);
        const badge = document.createElement("span");
        badge.className = "pill-badge " + (isCorrect ? "badge-correct" : "badge-incorrect");
        badge.textContent = isCorrect ? "✓" : "✕";
        pill.appendChild(badge);

        if (isCorrect) {
          pill.classList.add("is-correct");
        } else {
          pill.classList.add("is-incorrect");
          // Trigger reflow so shake animation replays reliably
          void pill.offsetWidth;
          pill.classList.add("shake-error");
        }
      }

      /**
       * Toggle cochlea golden victory aura and sparkle burst
       */
      function setVictoryVisuals(active) {
        if (active) {
          innerEarGroup.classList.add("cochlea-victory-active");
          cochleaSparkles.classList.remove("opacity-0", "sparkle-burst");
          void cochleaSparkles.offsetWidth;
          cochleaSparkles.classList.add("sparkle-burst");
        } else {
          innerEarGroup.classList.remove("cochlea-victory-active");
          cochleaSparkles.classList.remove("sparkle-burst");
          cochleaSparkles.classList.add("opacity-0");
        }
      }

      /**
       * Update tap-selection state
       */
      function setSelectedPill(pill) {
        if (selectedPillEl && selectedPillEl !== pill) {
          selectedPillEl.classList.remove("is-selected");
        }
        selectedPillEl = pill;
        if (selectedPillEl) {
          selectedPillEl.classList.add("is-selected");
          dropCausesEl.classList.add("is-tap-target");
          dropProtectEl.classList.add("is-tap-target");
        } else {
          dropCausesEl.classList.remove("is-tap-target");
          dropProtectEl.classList.remove("is-tap-target");
        }
      }

      /**
       * Move a pill into a target container (wordBank, dropCauses, or dropProtect)
       */
      function movePillToContainer(pill, targetContainer, playAudio) {
        if (!pill || !targetContainer) return;

        clearPillValidation(pill);
        setVictoryVisuals(false);

        if (selectedPillEl === pill) {
          setSelectedPill(null);
        }

        targetContainer.appendChild(pill);

        // Trigger spring snap animation
        pill.classList.remove("snap-in");
        void pill.offsetWidth;
        pill.classList.add("snap-in");

        statusMsgEl.textContent = "";
        statusMsgEl.style.color = "#4E6E82";

        if (playAudio) {
          SoundFX.drop();
        }
      }

      /**
       * Create a draggable & tappable word pill element
       */
      function createWordPill(item) {
        const pill = document.createElement("div");
        pill.className = "word-pill";
        pill.dataset.id = item.id;
        pill.dataset.correctCategory = item.correctCategory;
        pill.setAttribute("role", "button");
        pill.setAttribute("tabindex", "0");
        pill.setAttribute("aria-label", item.text);

        const labelSpan = document.createElement("span");
        labelSpan.textContent = item.text;
        pill.appendChild(labelSpan);

        // Custom Pointer Events Drag-and-Drop + Tap Detection
        pill.addEventListener("pointerdown", function (e) {
          if (e.button !== undefined && e.button !== 0) return;
          e.preventDefault();

          const rect = pill.getBoundingClientRect();
          dragState = {
            pill: pill,
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            offsetX: e.clientX - rect.left,
            offsetY: e.clientY - rect.top,
            hasMoved: false,
            ghostEl: null,
            activeDropTarget: null
          };

          try {
            pill.setPointerCapture(e.pointerId);
          } catch (err) {}
        });

        pill.addEventListener("pointermove", function (e) {
          if (!dragState || dragState.pill !== pill || dragState.pointerId !== e.pointerId) return;

          const dx = e.clientX - dragState.startX;
          const dy = e.clientY - dragState.startY;

          // Start drag once movement exceeds 6px threshold
          if (!dragState.hasMoved && Math.hypot(dx, dy) >= 6) {
            dragState.hasMoved = true;
            setSelectedPill(null);
            SoundFX.pickup();

            const ghost = document.createElement("div");
            ghost.className = "drag-ghost";
            ghost.textContent = item.text;
            document.body.appendChild(ghost);
            dragState.ghostEl = ghost;

            pill.classList.add("is-dragging-source");
          }

          if (dragState.hasMoved && dragState.ghostEl) {
            const x = e.clientX - dragState.offsetX;
            const y = e.clientY - dragState.offsetY;
            dragState.ghostEl.style.transform = "translate3d(" + x + "px, " + y + "px, 0) scale(1.04)";

            // Detect drop zone underneath pointer
            const hoveredZone = getDropZoneAtPoint(e.clientX, e.clientY);
            if (dragState.activeDropTarget !== hoveredZone) {
              if (dragState.activeDropTarget) {
                dragState.activeDropTarget.classList.remove("is-drag-over");
              }
              dragState.activeDropTarget = hoveredZone;
              if (dragState.activeDropTarget) {
                dragState.activeDropTarget.classList.add("is-drag-over");
              }
            }
          }
        });

        function finishPointerInteraction(e, cancelled) {
          if (!dragState || dragState.pill !== pill || dragState.pointerId !== e.pointerId) return;

          const current = dragState;
          dragState = null;

          try {
            pill.releasePointerCapture(e.pointerId);
          } catch (err) {}

          pill.classList.remove("is-dragging-source");

          if (current.ghostEl) {
            current.ghostEl.remove();
          }

          if (current.activeDropTarget) {
            current.activeDropTarget.classList.remove("is-drag-over");
          }

          if (cancelled) return;

          if (current.hasMoved) {
            const targetZone = getDropZoneAtPoint(e.clientX, e.clientY);
            if (targetZone && targetZone !== pill.parentElement) {
              movePillToContainer(pill, targetZone, true);
            }
          } else {
            // Short tap/click toggles selection for tap-to-place accessibility
            if (selectedPillEl === pill) {
              setSelectedPill(null);
            } else {
              setSelectedPill(pill);
              SoundFX.pickup();
            }
          }
        }

        pill.addEventListener("pointerup", function (e) {
          finishPointerInteraction(e, false);
        });

        pill.addEventListener("pointercancel", function (e) {
          finishPointerInteraction(e, true);
        });

        // Keyboard accessibility (Enter/Space to select/deselect)
        pill.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            if (selectedPillEl === pill) {
              setSelectedPill(null);
            } else {
              setSelectedPill(pill);
              SoundFX.pickup();
            }
          }
        });

        return pill;
      }

      /**
       * Determine which drop zone (wordBank, dropCauses, dropProtect) lies under (x, y)
       */
      function getDropZoneAtPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        if (!el) return null;
        for (let i = 0; i < dropContainers.length; i++) {
          if (dropContainers[i].contains(el)) {
            return dropContainers[i];
          }
        }
        return null;
      }

      /**
       * Enable tap-to-place on drop zones when a pill is selected
       */
      dropContainers.forEach(function (zone) {
        zone.addEventListener("click", function (e) {
          if (!selectedPillEl) return;
          // Ignore clicks directly on a pill (handled by pill's pointer events)
          if (e.target.closest(".word-pill")) return;

          if (selectedPillEl.parentElement !== zone) {
            movePillToContainer(selectedPillEl, zone, true);
          } else {
            setSelectedPill(null);
          }
        });
      });

      /**
       * Render all 8 words shuffled into the Word Bank (Initial Load & Reset)
       */
      function initWordBank(playAudio) {
        setSelectedPill(null);
        setVictoryVisuals(false);

        wordBankEl.innerHTML = "";
        dropCausesEl.innerHTML = "";
        dropProtectEl.innerHTML = "";

        const shuffled = shuffleArray(WORD_ITEMS);
        shuffled.forEach(function (item) {
          const pill = createWordPill(item);
          wordBankEl.appendChild(pill);
        });

        scoreDisplayEl.textContent = "Score: 0 / 8";
        statusMsgEl.textContent = "";
        statusMsgEl.style.color = "#4E6E82";

        if (playAudio) {
          SoundFX.reset();
        }
      }

      /**
       * Check Button Handler:
       * Evaluates every word currently placed inside the two table columns
       */
      checkBtn.addEventListener("click", function () {
        setSelectedPill(null);

        // Clear any leftover marks on unplaced pills in Word Bank
        const bankPills = wordBankEl.querySelectorAll(".word-pill");
        bankPills.forEach(clearPillValidation);

        const tableZones = [dropCausesEl, dropProtectEl];
        let placedCount = 0;
        let correctCount = 0;
        let incorrectCount = 0;

        tableZones.forEach(function (zone) {
          const zoneCategory = zone.dataset.category;
          const pills = zone.querySelectorAll(".word-pill");
          pills.forEach(function (pill) {
            placedCount++;
            const isMatch = pill.dataset.correctCategory === zoneCategory;
            markPill(pill, isMatch);
            if (isMatch) {
              correctCount++;
            } else {
              incorrectCount++;
            }
          });
        });

        scoreDisplayEl.textContent = "Score: " + correctCount + " / 8";

        if (placedCount === 0) {
          setVictoryVisuals(false);
          statusMsgEl.textContent = "Place the words into the table columns first.";
          statusMsgEl.style.color = "#19587f";
          SoundFX.wrong();
          return;
        }

        if (correctCount === 8 && placedCount === 8) {
          setVictoryVisuals(true);
          statusMsgEl.textContent = "Excellent! All 8 words are classified correctly.";
          statusMsgEl.style.color = "#1B6B42";
          SoundFX.victory();
        } else {
          setVictoryVisuals(false);
          const remaining = 8 - placedCount;
          if (remaining > 0) {
            statusMsgEl.textContent =
              correctCount + " correct, " + remaining + " remaining in the word bank.";
          } else {
            statusMsgEl.textContent =
              correctCount + " of 8 correct. Adjust the items marked with ✕.";
          }
          statusMsgEl.style.color = incorrectCount > 0 ? "#A82A1C" : "#19587f";
          if (incorrectCount > 0) {
            SoundFX.wrong();
          } else {
            SoundFX.correct();
          }
        }
      });

      /**
       * Show Answers Button Handler:
       * Places all 8 words into their matching columns, marks all 8 correct, sets Score: 8 / 8
       */
      showAnswersBtn.addEventListener("click", function () {
        setSelectedPill(null);

        const allPills = Array.from(document.querySelectorAll(".word-pill"));
        // Maintain canonical order from WORD_ITEMS
        WORD_ITEMS.forEach(function (item) {
          const pill = allPills.find(function (p) {
            return p.dataset.id === item.id;
          });
          if (!pill) return;

          const targetCol = item.correctCategory === "causes" ? dropCausesEl : dropProtectEl;
          targetCol.appendChild(pill);
          markPill(pill, true);
          pill.classList.remove("snap-in");
          void pill.offsetWidth;
          pill.classList.add("snap-in");
        });

        scoreDisplayEl.textContent = "Score: 8 / 8";
        statusMsgEl.textContent = "All 8 answers shown.";
        statusMsgEl.style.color = "#1B6B42";
        setVictoryVisuals(true);
        SoundFX.correct();
      });

      /**
       * Reset Button Handler:
       * Clears all validation states and returns all 8 words shuffled to #wordBank
       */
      resetBtn.addEventListener("click", function () {
        initWordBank(true);
      });

      // Initialize application immediately on DOM load
      initWordBank(false);
    })();
  </script>

  <!-- Reports the real content height to the parent page so the Moodle iframe never leaves empty space -->
  <script>
    (function () {
      "use strict";
      var main = document.querySelector("main");
      function sendHeight() {
        var h = Math.ceil(main.getBoundingClientRect().height);
        try { window.parent.postMessage({ type: "hearing-health-height", height: h }, "*"); } catch (e) {}
      }
      window.addEventListener("load", sendHeight);
      window.addEventListener("resize", sendHeight);
      if (window.ResizeObserver) { new ResizeObserver(sendHeight).observe(main); }
      setTimeout(sendHeight, 300);
      setTimeout(sendHeight, 1200);
    })();
  </script>
</body>
</html>
