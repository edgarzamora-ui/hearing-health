<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hearing Health Classification (Ruffle Interactive)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Enforce Verdana typography across the entire application */
    *, *::before, *::after {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #EAEEF3;
      color: #19587f;
      min-height: 100vh;
    }

    /* Ruffle Player Window Frame */
    .ruffle-window {
      background-color: #FFFFFF;
      border: 1.5px solid #D8E0E8;
      border-radius: 14px;
      box-shadow:
        0 16px 38px -10px rgba(25, 88, 127, 0.12),
        0 4px 12px -2px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    /* Flash Vector Word Pill Styling */
    .word-pill {
      background: linear-gradient(180deg, #FFFFFF 0%, #F7FAFC 100%);
      border: 1.5px solid #19587f;
      border-radius: 9999px;
      color: #19587f;
      font-weight: 700;
      box-shadow:
        0 2px 5px rgba(25, 88, 127, 0.14),
        inset 0 1px 0 #FFFFFF;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition:
        transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .word-pill:hover {
      border-color: #124260;
      box-shadow:
        0 4px 10px rgba(25, 88, 127, 0.2),
        inset 0 1px 0 #FFFFFF;
      transform: translateY(-1px);
    }

    .word-pill:active {
      cursor: grabbing;
    }

    /* Tap-to-select active state */
    .word-pill.is-selected {
      border-color: #ff791f;
      background: linear-gradient(180deg, #FFFDFB 0%, #FFF4EA 100%);
      box-shadow:
        0 0 0 3px rgba(255, 121, 31, 0.22),
        0 4px 12px rgba(255, 121, 31, 0.16);
      transform: translateY(-1px);
    }

    /* Source placeholder while dragging */
    .word-pill.is-dragging-source {
      opacity: 0.28;
      border-style: dashed;
      border-color: rgba(25, 88, 127, 0.45);
      box-shadow: none;
    }

    /* Floating drag clone following pointer */
    .drag-ghost {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      pointer-events: none;
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F6FA 100%);
      border: 1.5px solid #19587f;
      border-radius: 9999px;
      color: #19587f;
      font-weight: 700;
      box-shadow:
        0 14px 28px rgba(25, 88, 127, 0.24),
        0 4px 10px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 #FFFFFF;
      will-change: transform;
    }

    /* Spring snap-in animation on drop */
    @keyframes springSnap {
      0% {
        transform: scale(0.86);
      }
      55% {
        transform: scale(1.05);
      }
      80% {
        transform: scale(0.985);
      }
      100% {
        transform: scale(1);
      }
    }

    .snap-in {
      animation: springSnap 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Error horizontal shake animation */
    @keyframes pillShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .shake-error {
      animation: pillShake 0.36s ease-in-out;
    }

    /* Validation states on pills */
    .word-pill.is-correct {
      border-color: #16A34A;
      background: linear-gradient(180deg, #F6FEF9 0%, #E8F9EF 100%);
      box-shadow:
        0 2px 6px rgba(22, 163, 74, 0.14),
        inset 0 1px 0 #FFFFFF;
    }

    .word-pill.is-incorrect {
      border-color: #E11D48;
      background: linear-gradient(180deg, #FFF8F9 0%, #FDECEF 100%);
      box-shadow:
        0 2px 6px rgba(225, 29, 72, 0.14),
        inset 0 1px 0 #FFFFFF;
    }

    /* Drop Zone Hover Glow */
    .drop-zone {
      transition:
        background-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .drop-zone.is-drag-over {
      background-color: rgba(255, 121, 31, 0.045);
      box-shadow:
        inset 0 0 0 2px rgba(255, 121, 31, 0.38),
        inset 0 0 22px rgba(25, 88, 127, 0.06);
    }

    .word-bank-zone.is-drag-over {
      background-color: rgba(25, 88, 127, 0.035);
      box-shadow: inset 0 0 0 1.5px rgba(25, 88, 127, 0.28);
    }

    /* Classic Flash Gradient Action Buttons */
    .flash-btn-primary {
      background: linear-gradient(180deg, #2471A0 0%, #19587f 100%);
      border: 1.5px solid #134463;
      color: #FFFFFF;
      font-weight: 700;
      border-radius: 9px;
      box-shadow:
        0 2px 6px rgba(25, 88, 127, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }

    .flash-btn-primary:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow:
        0 4px 10px rgba(25, 88, 127, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .flash-btn-primary:active {
      transform: translateY(0);
      filter: brightness(0.97);
    }

    .flash-btn-accent {
      background: linear-gradient(180deg, #FF9142 0%, #ff791f 100%);
      border: 1.5px solid #D95F0E;
      color: #FFFFFF;
      font-weight: 700;
      border-radius: 9px;
      box-shadow:
        0 2px 6px rgba(255, 121, 31, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }

    .flash-btn-accent:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow:
        0 4px 10px rgba(255, 121, 31, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }

    .flash-btn-accent:active {
      transform: translateY(0);
      filter: brightness(0.97);
    }

    .flash-btn-secondary {
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
      border: 1.5px solid rgba(25, 88, 127, 0.32);
      color: #19587f;
      font-weight: 700;
      border-radius: 9px;
      box-shadow:
        0 2px 5px rgba(25, 88, 127, 0.08),
        inset 0 1px 0 #FFFFFF;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .flash-btn-secondary:hover {
      border-color: #19587f;
      background: linear-gradient(180deg, #FFFFFF 0%, #E9F0F6 100%);
      transform: translateY(-1px);
    }

    .flash-btn-secondary:active {
      transform: translateY(0);
    }

    /* Continuous Subtle Flash Vector Animations on the Ear Diagram */
    @keyframes soundWaveFlow1 {
      0%   { opacity: 0; transform: translateX(-14px) scale(0.94); }
      25%  { opacity: 0.55; }
      75%  { opacity: 0.35; }
      100% { opacity: 0; transform: translateX(22px) scale(1.04); }
    }

    @keyframes soundWaveFlow2 {
      0%   { opacity: 0; transform: translateX(-12px) scale(0.92); }
      30%  { opacity: 0.48; }
      80%  { opacity: 0.25; }
      100% { opacity: 0; transform: translateX(20px) scale(1.03); }
    }

    @keyframes eardrumMicroVibrate {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      25%      { transform: translate(0.75px, -0.25px) rotate(0.45deg); }
      50%      { transform: translate(-0.4px, 0.2px) rotate(-0.25deg); }
      75%      { transform: translate(0.65px, -0.15px) rotate(0.35deg); }
    }

    @keyframes ossiclesMicroVibrate {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      30%      { transform: translate(0.85px, -0.35px) rotate(-0.6deg); }
      60%      { transform: translate(-0.35px, 0.25px) rotate(0.35deg); }
      85%      { transform: translate(0.55px, -0.2px) rotate(-0.4deg); }
    }

    @keyframes cochleaShimmerPulse {
      0%, 100% { opacity: 0.18; transform: scale(0.99); }
      50%      { opacity: 0.62; transform: scale(1.015); }
    }

    @keyframes cochleaHarmonicHalo {
      0%, 100% { opacity: 0.65; transform: scale(0.97); }
      50%      { opacity: 1; transform: scale(1.05); }
    }

    @keyframes sparklePop {
      0%   { opacity: 0; transform: scale(0.2) rotate(0deg); }
      35%  { opacity: 1; transform: scale(1.15) rotate(35deg); }
      70%  { opacity: 0.85; transform: scale(0.95) rotate(65deg); }
      100% { opacity: 0; transform: scale(0.3) rotate(90deg); }
    }

    .anim-wave-1 {
      transform-origin: 185px 168px;
      animation: soundWaveFlow1 2.8s ease-in-out infinite;
    }

    .anim-wave-2 {
      transform-origin: 245px 166px;
      animation: soundWaveFlow2 2.8s ease-in-out 0.9s infinite;
    }

    .anim-wave-3 {
      transform-origin: 305px 164px;
      animation: soundWaveFlow2 2.8s ease-in-out 1.8s infinite;
    }

    .anim-eardrum {
      transform-origin: 368px 166px;
      animation: eardrumMicroVibrate 1.4s ease-in-out infinite;
    }

    .anim-ossicles {
      transform-origin: 392px 136px;
      animation: ossiclesMicroVibrate 1.4s ease-in-out 0.08s infinite;
    }

    .anim-cochlea-shimmer {
      transform-origin: 582px 162px;
      animation: cochleaShimmerPulse 3.2s ease-in-out infinite;
    }

    .cochlea-victory-active .victory-halo {
      opacity: 1;
      animation: cochleaHarmonicHalo 2.2s ease-in-out infinite;
    }

    .cochlea-victory-active .cochlea-core {
      filter: drop-shadow(0 0 10px rgba(248, 206, 120, 0.95)) drop-shadow(0 0 18px rgba(255, 121, 31, 0.55));
    }

    .sparkle-burst .sparkle-star {
      animation: sparklePop 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="flex items-center justify-center p-2.5 sm:p-5">

  <!-- Unified Pure-White Interactive Stage Window -->

            <filter id="harmonicAuraBlur" x="-50%" y="-50%" width="200%" height="200%">

            <!-- Warm Peach/Terracotta Auricle Gradients (#F7D5C2 to #C97B5B) -->

            <!-- Deep Indigo Contour (#3B498B) Framing Inner-Ear Capsule & Medial Tympanic Border -->
